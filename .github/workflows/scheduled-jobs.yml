name: Scheduled Jobs

on:
  schedule:
    # Yearly reset — runs daily at 00:00 UTC, but the job itself only acts on Aug 1.
    # (GitHub Actions cron doesn't support "once a year" directly, so we check the
    # date inside the job and skip on every other day.)
    - cron: '0 0 * * *'
  workflow_dispatch: {} # allows manually triggering from the Actions tab, for testing

jobs:
  yearly-reset:
    runs-on: ubuntu-latest
    steps:
      - name: Run yearly reset only on August 1st
        run: |
          TODAY=$(date -u +"%m-%d")
          if [ "$TODAY" = "08-01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Triggering yearly reset..."
            curl -X POST "${{ secrets.RENDER_APP_URL }}/api/admin/run-yearly-reset" \
              -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
              -f
          else
            echo "Not August 1st ($TODAY), skipping yearly reset."
          fi

  homework-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Run homework file cleanup daily
        run: |
          curl -X POST "${{ secrets.RENDER_APP_URL }}/api/admin/run-homework-cleanup" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -f
